[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-career"
version = "0.1.0"
description = "Retrieve and plot a tennis player's career matches from Tennis Abstract"
requires-python = ">=3.9"
dependencies = ["pandas", "requests", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
